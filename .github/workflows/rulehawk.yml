name: Firewall gate

# Every PR that touches a firewall config gets audited before it can merge:
#   1. hygiene + zone segmentation across ALL configs (PCI isolation proofs)
#   2. Zscaler egress connectivity proofs, scoped to the configs that own the
#      egress path (a branch filter is not supposed to reach the ZEN ranges,
#      so connectivity policies are applied per config set — see README).
on:
  pull_request:
  push:
    branches: [main]
  # The weekly Zscaler refresh dispatches this on its bot branch, because
  # pull_request runs on a PR made with GITHUB_TOKEN wait for manual approval.
  workflow_dispatch:

# Dispatched runs on one branch are serialized and the newest wins, so an
# older run cannot overwrite a newer verdict. Other events get a group of
# their own (the run id), so pull_request and push behave exactly as before.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('gate-dispatch-{0}', github.ref) || format('gate-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read
  security-events: write   # SARIF -> inline annotations on the PR diff
  pull-requests: write     # the sticky review comment

# Every proof shares its result (share-results) instead of commenting on its
# own; the verdict job below folds them into ONE sticky comment headed by the
# worst verdict (FAIL > UNKNOWN > PASS), so a passing proof can never paint
# the comment green while another one fails.

jobs:
  segmentation:
    name: Hygiene + PCI segmentation (all configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: optimesh-ai/RuleHawk@618bdf45337c2b53bc42ea364248b254ccb189cb  # main after PR #18; repin to the next release
        with:
          configs: network/*
          policy: policy/segmentation.json
          fail-on: high
          label: Hygiene + PCI segmentation (all configs)
          comment: false          # the verdict job posts one comment for every proof
          share-results: true

  zscaler-egress:
    name: Zscaler egress connectivity proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edge firewall must permit the ZEN + tunnel flows
        uses: optimesh-ai/RuleHawk@618bdf45337c2b53bc42ea364248b254ccb189cb  # main after PR #18; repin to the next release
        with:
          configs: network/edge-asa.cfg
          policy: policy/egress-edge.json
          fail-on: high
          label: Edge firewall must permit the ZEN + tunnel flows
          comment: false          # the verdict job posts one comment for every proof
          share-results: true
          upload-sarif: false     # one SARIF category per PR (segmentation job owns it)
      - name: Linux egress gateway must forward the browser flows
        if: always()              # report both proofs even if the first fails
        uses: optimesh-ai/RuleHawk@618bdf45337c2b53bc42ea364248b254ccb189cb  # main after PR #18; repin to the next release
        with:
          configs: network/egress-iptables.rules
          policy: policy/egress-host.json
          fail-on: high
          label: Linux egress gateway must forward the browser flows
          comment: false
          share-results: true
          upload-sarif: false

  # One sticky comment for the whole gate: every proof above, headed by the
  # worst verdict. Fewer than `expect` results, or a proof job that did not
  # succeed without a failing result to show for it, reads UNKNOWN, never PASS.
  verdict:
    name: Firewall gate verdict (every proof)
    if: ${{ !cancelled() }}
    needs: [segmentation, zscaler-egress]
    runs-on: ubuntu-latest
    steps:
      - id: combined
        uses: optimesh-ai/RuleHawk/comment@618bdf45337c2b53bc42ea364248b254ccb189cb  # main after PR #18; repin to the next release
        with:
          expect: 3               # one per proof step above
          jobs: ${{ toJSON(needs) }}
      # The action only comments on pull_request events. On a dispatched run,
      # post the same combined comment on the open PR whose head is this branch.
      - name: Sticky PR comment (dispatched run)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          # Via env, never ${{ }} inside the script: the ref is caller-chosen.
          RH_REF: ${{ github.ref_name }}
          RH_COMMENT_PATH: ${{ steps.combined.outputs.comment-file }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- rulehawk-gate -->';
            const path = process.env.RH_COMMENT_PATH;
            let body = '';
            try { body = fs.readFileSync(path, 'utf8'); }
            catch (e) { core.warning('no comment body: ' + e); return; }
            body += `\n\n<sub>Checked commit ${context.sha.slice(0, 7)}.</sub>\n`;
            const {owner, repo} = context.repo;
            const {data: prs} = await github.rest.pulls.list(
              {owner, repo, state: 'open', head: `${owner}:${process.env.RH_REF}`});
            // Only comment when this run checked the PR's current head.
            const pr = prs.find(p => p.head.sha === context.sha);
            if (!pr) { core.notice('no open PR at this commit; nothing to comment on'); return; }
            const comments = await github.paginate(github.rest.issues.listComments,
              {owner, repo, issue_number: pr.number, per_page: 100});
            // The verdict comment is ours: the marker alone could be quoted
            // by a person.
            const mine = comments.find(c => c.user && c.user.login === 'github-actions[bot]'
              && c.body && c.body.includes(marker));
            // Re-check the head right before writing: a push since the lookup
            // means this verdict is for an older commit.
            const {data: now} = await github.rest.pulls.get(
              {owner, repo, pull_number: pr.number});
            if (now.head.sha !== context.sha) {
              core.notice('the PR moved on since this run started; not posting a stale verdict');
              return;
            }
            let commentId;
            if (mine) {
              await github.rest.issues.updateComment(
                {owner, repo, comment_id: mine.id, body});
              commentId = mine.id;
            } else {
              const {data: made} = await github.rest.issues.createComment(
                {owner, repo, issue_number: pr.number, body});
              commentId = made.id;
            }
            // A push can still land between the check above and the write.
            // If it did, say so on the comment instead of leaving an old
            // verdict standing; the newer commit's own run replaces it.
            const {data: after} = await github.rest.pulls.get(
              {owner, repo, pull_number: pr.number});
            if (after.head.sha !== context.sha) {
              await github.rest.issues.updateComment({owner, repo, comment_id: commentId,
                body: `${marker}\nThis verdict was for commit ${context.sha.slice(0, 7)}; ` +
                      `the PR is now at ${after.head.sha.slice(0, 7)}. ` +
                      'The gate run for the new commit replaces this comment.\n'});
            }


  # Check runs from a dispatched run sit on the commit but are not listed on
  # the PR. Commit statuses are, so mirror each proof's result as one.
  pr-status:
    name: Report dispatched verdicts on the PR
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs: [segmentation, zscaler-egress, verdict]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v9
        env:
          SEG_RESULT: ${{ needs.segmentation.result }}
          EGRESS_RESULT: ${{ needs.zscaler-egress.result }}
          VERDICT_RESULT: ${{ needs.verdict.result }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const target_url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const state = r => r === 'success' ? 'success' : (r === 'failure' ? 'failure' : 'error');
            for (const [name, result] of [
              ['Hygiene + PCI segmentation (all configs)', process.env.SEG_RESULT],
              ['Zscaler egress connectivity proofs', process.env.EGRESS_RESULT],
              ['Firewall gate verdict (every proof)', process.env.VERDICT_RESULT],
            ]) {
              await github.rest.repos.createCommitStatus({owner, repo, sha: context.sha,
                state: state(result), context: `Firewall gate / ${name}`,
                description: `${result} (dispatched run)`, target_url});
            }
