name: Firewall gate

# Every PR that touches a firewall config gets audited before it can merge:
#   1. hygiene + zone segmentation across ALL configs (PCI isolation proofs)
#   2. Zscaler egress connectivity proofs, scoped to the configs that own the
#      egress path (a branch filter is not supposed to reach the ZEN ranges,
#      so connectivity policies are applied per config set — see README).
on:
  pull_request:
  push:
    branches: [main]
  # The weekly Zscaler refresh dispatches this on its bot branch, because
  # pull_request runs on a PR made with GITHUB_TOKEN wait for manual approval.
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # SARIF -> inline annotations on the PR diff
  pull-requests: write     # the sticky review comment

jobs:
  segmentation:
    name: Hygiene + PCI segmentation (all configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: optimesh-ai/RuleHawk@v0.3.1
        with:
          configs: network/*
          policy: policy/segmentation.json
          fail-on: high
      # The action only comments on pull_request events. On a dispatched run,
      # post the same sticky comment on the open PR whose head is this branch.
      - name: Sticky PR comment (dispatched run)
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          # Via env, never ${{ }} inside the script: the ref is caller-chosen.
          RH_REF: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- rulehawk-gate -->';
            const path = `${process.env.RUNNER_TEMP}/rulehawk-comment.md`;
            let body = '';
            try { body = fs.readFileSync(path, 'utf8'); }
            catch (e) { core.warning('no comment body: ' + e); return; }
            const {owner, repo} = context.repo;
            const {data: prs} = await github.rest.pulls.list(
              {owner, repo, state: 'open', head: `${owner}:${process.env.RH_REF}`});
            // Only comment when this run checked the PR's current head.
            const pr = prs.find(p => p.head.sha === context.sha);
            if (!pr) { core.notice('no open PR at this commit; nothing to comment on'); return; }
            const {data: comments} = await github.rest.issues.listComments(
              {owner, repo, issue_number: pr.number, per_page: 100});
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment(
                {owner, repo, comment_id: mine.id, body});
            } else {
              await github.rest.issues.createComment(
                {owner, repo, issue_number: pr.number, body});
            }

  zscaler-egress:
    name: Zscaler egress connectivity proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edge firewall must permit the ZEN + tunnel flows
        uses: optimesh-ai/RuleHawk@v0.3.1
        with:
          configs: network/edge-asa.cfg
          policy: policy/egress-edge.json
          fail-on: high
          comment: false          # one sticky comment per PR (segmentation job owns it)
          upload-sarif: false     # one SARIF category per PR (segmentation job owns it)
      - name: Linux egress gateway must forward the browser flows
        if: always()              # report both proofs even if the first fails
        uses: optimesh-ai/RuleHawk@v0.3.1
        with:
          configs: network/egress-iptables.rules
          policy: policy/egress-host.json
          fail-on: high
          comment: false
          upload-sarif: false
