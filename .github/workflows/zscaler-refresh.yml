name: Zscaler range refresh

# Zscaler expands its enforcement-node ranges over time. This job pulls the
# published feed weekly; when it changes, it opens a PR updating the
# ZSCALER_ZEN zone — and the Firewall gate on that PR then PROVES whether the
# current configs already permit the new ranges, or the rollout needs a
# firewall change first. Egress readiness stays continuously verified.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write   # dispatch the Firewall gate on the bot branch (see below)

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update ZEN ranges from the published feed
        run: python3 tools/update_zscaler_zones.py
      - name: Open or update the rolling PR (one branch, never more)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/zscaler-ranges
          TITLE: Zscaler ZEN ranges changed — re-prove egress connectivity
        run: |
          set -euo pipefail
          # One fixed branch, force-updated each week: stale dated branches
          # cannot pile up. No upstream change -> the branch (and its PR)
          # is removed, so nothing lingers.
          if git diff --quiet -- policy/; then
            echo "no change upstream"
            if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null; then
              gh pr close "${BRANCH}" --comment "Feed matches main again; closing." 2>/dev/null || true
              git push origin --delete "${BRANCH}"
            fi
            exit 0
          fi
          git config user.name "zscaler-refresh[bot]"
          git config user.email "actions@github.com"
          git switch -C "${BRANCH}"
          git add policy/
          git commit -m "Zscaler ZEN ranges changed upstream — re-prove egress"
          git push --force origin "${BRANCH}"
          if [ -n "$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[].number')" ]; then
            echo "rolling PR updated"
          elif ! gh pr create --head "${BRANCH}" --base main --title "${TITLE}" \
            --body "The published enforcement-node feed changed. The **Firewall gate** on this PR proves whether the current configs already permit the new ranges (connectivity-ok) or the rollout needs a firewall change first (connectivity-broken). This branch is force-updated weekly; there is only ever one."; then
            echo "::error title=Could not open the Zscaler PR::Branch ${BRANCH} was pushed, but the PR could not be created. Allow GitHub Actions to create pull requests (org and repo Settings > Actions > General), or open it by hand: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}"
            exit 1
          fi
          # A push or PR made with GITHUB_TOKEN gets no unattended pull_request
          # run: GitHub holds it as "action_required" until someone approves it.
          # workflow_dispatch is the documented exception, so start the gate
          # here. Its checks attach to the branch head, which is the PR head,
          # and it posts the same sticky verdict comment on the rolling PR.
          gh workflow run rulehawk.yml --ref "${BRANCH}"
          echo "Firewall gate dispatched on ${BRANCH}"
